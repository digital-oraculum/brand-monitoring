<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Ustaw w każdej appce: -->
  <meta name="app-name" content="Brand Monitoring" />
  <title>Zaloguj się</title>
  <style>
    :root {
      --bg0: #0c1219;
      --bg1: #15202b;
      --text: #e8eef4;
      --muted: #8b9aab;
      --line: #2a3544;
      --accent: #2f6fed;
      --accent-hover: #3d8bfd;
      --danger: #e06c75;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 480px at 15% -5%, #1a3355 0%, transparent 55%),
        radial-gradient(700px 400px at 95% 10%, #132a22 0%, transparent 50%),
        var(--bg0);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(420px, 100%);
      background: color-mix(in srgb, var(--bg1) 94%, transparent);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 32px 28px 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }
    .brand {
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 10px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.55rem;
      font-weight: 650;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }
    p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.95rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 13px 16px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      color: #fff;
      background: var(--accent);
      transition: background 0.15s ease;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn svg { flex-shrink: 0; }
    .error {
      display: none;
      margin: 0 0 16px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(224, 108, 117, 0.12);
      border: 1px solid rgba(224, 108, 117, 0.35);
      color: #f0a8ad;
      font-size: 0.88rem;
    }
    .error.show { display: block; }

  </style>
</head>
<body>
  <main class="card">
    <p class="brand" id="appBrand">Aplikacja</p>
    <h1>Zaloguj się</h1>
    <p>
      Aby kontynuować, zaloguj się kontem Google.
      Dostęp nadaje organizacja poprzez Google Workspace.
    </p>
    <div id="errorBox" class="error"></div>
    <a class="btn" id="loginBtn" href="/auth/google">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.2 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.5-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.2 6.1 29.3 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.3 26.7 36 24 36c-5.3 0-9.7-3.1-11.3-7.5l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.6l.0.0 6.2 5.2C39.2 36.3 44 31 44 24c0-1.3-.1-2.5-.4-3.5z"/>
      </svg>
      Zaloguj przez Google
    </a>
  </main>
  <script>
    (function () {
      var meta = document.querySelector('meta[name="app-name"]');
      var name = (meta && meta.content) || "Aplikacja";
      document.getElementById("appBrand").textContent = name;
      document.title = "Zaloguj się · " + name;

      var params = new URLSearchParams(location.search);
      var err = params.get("error");
      if (err) {
        var box = document.getElementById("errorBox");
        var messages = {
          oauth_denied: "Logowanie zostało anulowane.",
          missing_code: "Brak kodu logowania. Spróbuj ponownie.",
          auth_failed: "Logowanie nie powiodło się. Spróbuj ponownie.",
          not_allowed: "To konto nie ma dostępu."
        };
        box.textContent = messages[err] || ("Błąd logowania: " + err);
        box.classList.add("show");
      }
    })();
  </script>
</body>
</html>
